<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みらいのお買い物｜学習用</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#243047;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;padding:16px 16px 48px}header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px}h1{font-size:22px;margin:0}h2{font-size:19px;margin:0 0 12px}.sub{color:#66728a;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.tabs button{background:#e4e8f3;color:#33415c}.tabs button.active{background:#263e7a;color:white}.panel{background:white;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 5px 20px #1a31500e}.pay{background:linear-gradient(135deg,#f64a55,#db2542);color:white}.card{background:linear-gradient(135deg,#243e83,#17254e);color:white}.amount{font-size:36px;font-weight:800;letter-spacing:-1px;margin:8px 0}.muted{font-size:13px;opacity:.82}button{font:inherit;border:0;border-radius:12px;padding:14px 16px;font-weight:700;cursor:pointer}button.primary{background:#263e7a;color:white;width:100%;margin-top:8px}button.red{background:#e93e51;color:white;width:100%;margin-top:8px}button.light{background:#eef1f8;color:#273650}button:disabled{opacity:.5}label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}input{font:inherit;width:100%;padding:14px;border:2px solid #dbe1ec;border-radius:12px;font-size:20px}input:focus{outline:2px solid #7891db}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.history{padding:12px 0;border-bottom:1px solid #edf0f5}.history:last-child{border:0}.right{text-align:right}.small{font-size:12px;color:#66728a}.hidden{display:none}.notice{padding:12px;border-radius:12px;background:#fff4d7;color:#654b16;font-size:13px;line-height:1.6}.msg{padding:12px;border-radius:12px;background:#e9f7ee;color:#14572f;margin:10px 0;font-weight:700}.error{background:#ffe9e9;color:#a02231}.shop-banner{border:2px solid #f6a0aa;background:#fff3f4;padding:14px;border-radius:14px;margin-bottom:12px}.shop-banner strong{color:#bc2342}.confirm{background:#f4f6fb;border-radius:12px;padding:16px;margin-top:12px}.qrbox{display:flex;justify-content:center;background:white;padding:18px;border-radius:14px}.qrbox canvas,.qrbox img{max-width:100%;height:auto}.tag{background:#fff2c7;color:#6e5411;padding:4px 8px;border-radius:8px;font-size:12px}footer{text-align:center;font-size:12px;color:#788397;margin-top:24px}@media print{.tabs,header,.notice,footer,.panel:not(:has(#shop-qr)),button{display:none!important}main{max-width:100%;}#shop-qr button{display:none!important}} .scanview{width:100%;border-radius:12px;background:#111;max-height:330px;object-fit:cover}.scan-actions{display:grid;gap:8px;margin-top:10px}.scan-actions button{width:100%}@media print{#staff-area{display:block!important}} </style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script></head><body><main><header><div><h1>みらいのお買い物</h1><div class="sub">お金の学習シミュレーター</div></div><span class="tag">学習用</span></header><div class="notice">これは授業用の架空のアプリです。実際のお金は動きません。入力した内容は、この端末のブラウザに保存されます。</div><div class="tabs"><button id="tab-pay" onclick="switchTab('pay')">みらいPay</button><button id="tab-card" onclick="switchTab('card')">みらいカード</button></div><div id="app"></div><footer>個人情報・実際のカード番号は入力しないでください。</footer></main><script>
const KEY='mirai-shop-lesson-v1';const fresh=()=>({payBalance:0,payHistory:[],cardHistory:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}let tab='pay',message='',isError=false;let shopMode=new URLSearchParams(location.search).get('shop')==='mirai';let pending=null,scanStream=null,scanActive=false;const yen=n=>Number(n).toLocaleString('ja-JP')+'円';const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const now=()=>new Date().toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});const sum=()=>data.cardHistory.reduce((s,x)=>s+x.amount,0);function switchTab(x){stopScan();tab=x;message='';pending=null;render()}function show(t,e=false){message=t;isError=e;render()}function getAmount(id){let s=document.getElementById(id).value.trim();if(!/^\d+$/.test(s))return null;let n=Number(s);return Number.isSafeInteger(n)&&n>=1&&n<=1000000?n:null}function historyHTML(items,type){return items.length?items.map(x=>`<div class="history row"><div><strong>${escapeHTML(x.name)}</strong><div class="small">${escapeHTML(x.time)}</div></div><div class="right"><strong>${type==='pay'?(x.amount>0?'+':'')+yen(x.amount):yen(x.amount)}</strong></div></div>`).join(''):'<p class="sub">まだ利用履歴はありません。</p>'}function render(){document.getElementById('tab-pay').classList.toggle('active',tab==='pay');document.getElementById('tab-card').classList.toggle('active',tab==='card');let shopBanner=shopMode&&tab==='pay'?'<div class="shop-banner"><strong>みらいショップ</strong><div>QRコードを読み取りました。商品を選んで金額を入力してください。</div></div>':'';let m=message?`<div role="status" class="msg ${isError?'error':''}">${escapeHTML(message)}</div>`:'';document.getElementById('app').innerHTML=tab==='pay'?`${shopBanner}<section class="panel pay"><div class="muted">チャージ残高</div><div class="amount">${yen(data.payBalance)}</div><div class="muted">支払うと、この残高が減ります。</div></section>${m}${shopMode?`<section class="panel"><h2>みらいショップで支払う</h2><p class="sub">お店のQRコードを読み取りました。金額を入力し、確認してから支払いましょう。</p><label for="pay-name">買ったもの</label><input id="pay-name" maxlength="30" placeholder="例：文房具"><label for="pay-amount">支払う金額（円）</label><input id="pay-amount" type="number" inputmode="numeric" min="1" max="1000000" placeholder="例：500"><button class="red" onclick="preparePay()">金額を確認する</button><div id="pay-confirm"></div><button class="light" style="width:100%;margin-top:12px" onclick="leaveShop()">支払いをやめる</button></section>`:`<section class="panel"><h2>QRコードを読み取って支払う</h2><p class="sub">お店に置いてあるQRコードを読み取ると、金額を入力できます。</p><button class="red" onclick="startScan()">QRコードを読み取る</button><div id="scan-area"></div><div class="notice" style="margin-top:12px">カメラが使えない場合は、スマホの標準カメラでお店のQRコードを読み取ってください。</div></section>`}<section class="panel"><h2>利用履歴</h2>${historyHTML(data.payHistory,'pay')}</section><section class="panel"><h2>職員用メニュー</h2><p class="sub">チャージ・リセット・お店のQRコードの表示は職員専用です。</p><button class="light" onclick="staff('pay')">職員用メニューを開く</button><div id="staff-area"></div></section>`:`<section class="panel card"><div class="muted">MIRAI CARD　•••• 1234（架空）</div><div style="margin-top:18px" class="muted">あとから払う予定のお金</div><div class="amount">${yen(sum())}</div><div class="muted">カードを使うと、この金額が増えます。</div></section>${m}<section class="panel"><h2>カードで買い物</h2><label for="card-name">買ったもの・お店の名前</label><input id="card-name" maxlength="30" placeholder="例：文房具"><label for="card-amount">利用する金額（円）</label><input id="card-amount" type="number" inputmode="numeric" min="1" max="1000000" placeholder="例：500"><button class="primary" onclick="useCard()">カードで支払う（学習用）</button><p class="sub">その場で現金は渡しませんが、あとから支払う必要があります。</p></section><section class="panel"><h2>利用履歴</h2>${historyHTML(data.cardHistory,'card')}</section><section class="panel"><h2>職員用メニュー</h2><button class="light" onclick="staff('card')">職員用メニューを開く</button><div id="staff-area"></div></section>`}function preparePay(){if(!shopMode)return show('お店のQRコードを読み取ってください。',true);const n=getAmount('pay-amount'),name=document.getElementById('pay-name').value.trim()||'みらいショップ';if(n===null)return show('1円〜1,000,000円の金額を入力してください。',true);if(n>data.payBalance)return show('残高が足りません。職員にチャージしてもらいましょう。',true);pending={n,name};document.getElementById('pay-confirm').innerHTML=`<div class="confirm"><strong>支払い内容を確認</strong><p>お店・商品：${escapeHTML(name)}</p><p>支払う金額：<strong>${yen(n)}</strong></p><p>支払い後の残高：<strong>${yen(data.payBalance-n)}</strong></p><button class="red" onclick="finishPay()">この金額で支払う</button><button class="light" style="margin-top:8px;width:100%" onclick="cancelPay()">戻って修正する</button></div>`;}function cancelPay(){pending=null;document.getElementById('pay-confirm').innerHTML=''}function finishPay(){if(!shopMode||!pending)return;const {n,name}=pending;if(n>data.payBalance)return show('残高が足りません。',true);data.payBalance-=n;data.payHistory.unshift({name,amount:-n,time:now()});pending=null;save();shopMode=false;history.replaceState(null,'',location.pathname+location.hash);show(yen(n)+'を支払いました。残高は'+yen(data.payBalance)+'です。')}
function makeShopQR(){const target=new URL(location.href);target.search='?shop=mirai';target.hash='';const holder=document.getElementById('shop-qr');if(!holder)return;holder.innerHTML='<div class="qrbox" id="qr-inner"></div><p class="small">このQRは現在公開されているアプリのURLを使用します。ローカルファイルではなく、GitHub Pages上で表示してください。</p><button class="light" onclick="window.print()">印刷する</button>';if(location.protocol==='file:'){holder.innerHTML='<p class="notice">先にGitHub Pagesに公開してください。公開URLからQRコードを作れます。</p>';return;}if(typeof QRCode==='undefined'){holder.innerHTML='<p class="notice">QRコードの生成ライブラリを読み込めませんでした。ネット接続を確認してください。</p><p class="small">'+escapeHTML(target.href)+'</p>';return;}new QRCode(document.getElementById('qr-inner'),{text:target.href,width:220,height:220,correctLevel:QRCode.CorrectLevel.H});}
function leaveShop(){shopMode=false;pending=null;history.replaceState(null,'',location.pathname+location.hash);render()}
function cancelScan(){stopScan();const a=document.getElementById('scan-area');if(a)a.innerHTML=''}function stopScan(){scanActive=false;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
function acceptScan(value){let u;try{u=new URL(value)}catch{return false}if(u.origin!==location.origin||u.pathname!==location.pathname||u.searchParams.get('shop')!=='mirai')return false;stopScan();shopMode=true;pending=null;history.replaceState(null,'',location.pathname+'?shop=mirai');show('みらいショップのQRコードを読み取りました。');return true}
async function startScan(){if(shopMode)return;const area=document.getElementById('scan-area');if(!area)return;area.innerHTML='<p class="sub">カメラを起動しています…</p>';if(!navigator.mediaDevices?.getUserMedia){area.innerHTML='<p class="notice">このブラウザではカメラを起動できません。スマホの標準カメラで読み取ってください。</p>';return}if(!('BarcodeDetector' in window)){area.innerHTML='<p class="notice">このブラウザはアプリ内のQR読み取りに対応していません。スマホの標準カメラでお店のQRコードを読み取ってください。</p>';return}try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});area.innerHTML='<video id="scan-video" class="scanview" autoplay playsinline muted></video><div class="scan-actions"><button class="light" onclick="cancelScan()">読み取りを中止する</button></div><p class="sub">お店のQRコードをカメラに映してください。</p>';const video=document.getElementById('scan-video');video.srcObject=scanStream;await video.play();const detector=new BarcodeDetector({formats:['qr_code']});scanActive=true;async function tick(){if(!scanActive)return;try{const codes=await detector.detect(video);for(const code of codes){if(acceptScan(code.rawValue))return} }catch{}if(scanActive)requestAnimationFrame(tick)}requestAnimationFrame(tick)}catch(e){stopScan();area.innerHTML='<p class="notice">カメラを起動できませんでした。カメラの許可を確認するか、スマホの標準カメラで読み取ってください。</p>'}}
function useCard(){const n=getAmount('card-amount'),name=document.getElementById('card-name').value.trim()||'お買い物';if(n===null)return show('1円〜1,000,000円の金額を入力してください。',true);data.cardHistory.unshift({name,amount:n,time:now()});save();show(yen(n)+'を利用しました。あとから払う予定は'+yen(sum())+'です。')}function staff(which){const pin=prompt('職員用の暗証番号を入力してください');if(pin===null)return;if(pin!=='4826')return show('暗証番号が違います。',true);document.getElementById('staff-area').innerHTML=which==='pay'?`<label for="charge">チャージ金額（円）</label><input id="charge" type="number" inputmode="numeric" min="1" max="1000000" placeholder="例：3000"><button class="primary" onclick="charge()">チャージする</button><h2 style="margin-top:22px">お店のQRコード</h2><p class="sub">印刷してお店に置いてください。</p><button class="light" onclick="makeShopQR()">お店のQRコードを表示</button><div id="shop-qr" style="margin-top:12px"></div><button class="light" style="margin-top:12px" onclick="resetApp('pay')">みらいPayの履歴・残高をリセット</button>`:`<p class="sub">利用履歴と支払い予定額を0円に戻します。</p><button class="light" onclick="resetApp('card')">みらいカードをリセット</button>`}function charge(){let n=getAmount('charge');if(n===null)return show('1円〜1,000,000円の金額を入力してください。',true);if(data.payBalance+n>10000000)return show('チャージ上限は合計10,000,000円です。',true);data.payBalance+=n;data.payHistory.unshift({name:'職員によるチャージ',amount:n,time:now()});save();show(yen(n)+'をチャージしました。')}function resetApp(which){if(!confirm('このアプリの学習データをリセットしますか？'))return;if(which==='pay'){data.payBalance=0;data.payHistory=[]}else data.cardHistory=[];save();show('リセットしました。')}if(shopMode)tab='pay';render();
</script></body></html>
